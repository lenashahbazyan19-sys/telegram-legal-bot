name: Pack and Upload Telegram Bot to S3 (With Auto Create Bucket)

on:
  push:
    branches:
      - main

jobs:
  deploy-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Archive Bot Files
        run: |
          zip -r telegram-bot.zip bot.py lawyer_office.jpg

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Ensure S3 Bucket Exists
        run: |
          BUCKET_NAME="lena-legal1-bot-zip-20026"
          
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Bucket '$BUCKET_NAME' already exists. No creation is required."
          else
            echo "Bucket '$BUCKET_NAME' not found. Creating a new one..."
            aws s3 mb "s3://$BUCKET_NAME" --region eu-north-1
          fi

      - name: Upload ZIP to AWS S3
        run: |
          BUCKET_NAME="lena-legal1-bot-zip-20026"
          aws s3 cp telegram-bot.zip "s3://$BUCKET_NAME/telegram-bot.zip"
