name: Deploy System Info to Nginx

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
   
    - name: Checkout repository
      uses: actions/checkout@v4

    
    - name: Execute Bash script on AWS via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cat << 'EOF' > /var/www/html/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <title>CI/CD Отчет для учителя</title>
              <style>
                  body { font-family: monospace; background-color: #0f172a; color: #38bdf8; padding: 40px; }
                  h1 { color: #ffffff; border-bottom: 2px solid #38bdf8; padding-bottom: 10px; }
                  pre { background: #1e293b; padding: 15px; border-radius: 8px; font-size: 14px; border: 1px solid #475569; color: #f8fafc; }
                  .success { color: #4ade80; font-weight: bold; }
              </style>
          </head>
          <body>
              <h1>Сборка успешно выполнена через GitHub Actions! </h1>
              <p><strong>Статус триггера:</strong> <span class="success">Код успешно доставлен (Push)</span></p>
              <p><strong>Время обновления данных:</strong> '"$(date)'"</p>
              
              <h2>Оперативная память инстанса (free -h):</h2>
              <pre>'"$(free -h)'"</pre>

              <h2>Дисковое пространство инстанса (df -h):</h2>
              <pre>'"$(df -h)'"</pre>
          </body>
          </html>
          EOF
          sudo systemctl reload nginx
